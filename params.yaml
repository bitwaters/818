rules:
  version: "v6-chain-strategies-shadow"
  reset_id: "2026-08-20-hotpool-v5"
  delivery_reset_id: "2026-08-20-clear-pushed-v5"

chains:
  sol: true
  bsc: true

poll:
  smartmoney: 5
  trending: 10
  hot_searches: 15
  signal: 10

intervals:
  trending: ["1m", "5m"]

hot_pool:
  rank_limit: 100

cache:
  evidence_ttl_sec: 180
  push_cooldown_sec: 3600

sources:
  smartmoney: true
  trending: true
  hot_searches: true
  signal_12: true
  signal_6: false
  signal_7: false
  signal_10: true

strategy:
  # SOL 独立影子策略：完整过线和安全检查，仅记录首个基线，不推送或计入实盘统计。
  sol:
    mode: shadow
    hot_pool:
      enabled: true
      membership_ttl_sec: 30
      new_token_grace_sec: 360
    pass:
      min_entry_mc: 10000
      min_liquidity_usd: 0
    flow:
      require_smart_money: false
      min_smart_wallets: 2
      require_net_buy: true
      min_price_change_since_entry: 1.0
    tape:
      min_volume_usd: 3000
      min_swaps: 20
      min_price_change_1m: 0
      max_price_change_1m: 0
      high_momentum_1m: 100
      extreme_momentum_1m: 300
      min_price_change_5m: 0
      require_price_change_5m: true
      max_buy_sell_ratio: 3
      min_volume_market_cap_ratio: 0.25
      max_volume_market_cap_ratio: 2.0
    attention:
      min_visiting_count: 100

  # BSC 保持现行实盘参数。
  bsc:
    mode: live
    hot_pool:
      enabled: true
      membership_ttl_sec: 30
      new_token_grace_sec: 360
    pass:
      min_entry_mc: 10000
      min_liquidity_usd: 10000
    flow:
      require_smart_money: false
      min_smart_wallets: 2
      require_net_buy: true
      min_price_change_since_entry: 1.0
    tape:
      min_volume_usd: 5000
      min_swaps: 20
      min_price_change_1m: 0
      max_price_change_1m: 0
      high_momentum_1m: 100
      extreme_momentum_1m: 300
      min_price_change_5m: 0
      require_price_change_5m: true
      max_buy_sell_ratio: 3
      min_volume_market_cap_ratio: 0.25
      max_volume_market_cap_ratio: 2.0
    attention:
      min_visiting_count: 100

attention:
  use_interval: "1m"

l0_sol:
  require_renounced_mint: true
  require_renounced_freeze: true
  rug_ratio_max: 0.3
  drop_wash_trading: true
  rat_trader_rate_max: 0.3
  bundler_rate_max: 0.3
  top10_holder_rate_max: 0.5
  drop_signal_10: true

l0_bsc:
  require_not_honeypot: true
  require_owner_renounced: true
  require_open_source: false
  require_lp_lock: false
  sell_tax_max: 0.10
  buy_tax_max: 0.10
  rug_ratio_max: 0.3
  drop_wash_trading: true
  rat_trader_rate_max: 0.3
  bundler_rate_max: 0.5
  top10_holder_rate_max: 0.5
  min_holder_count: 50
  bot_degen_rate_max: 0.5
  drop_signal_10: true

push:
  telegram_enabled: true
  parse_mode: "HTML"
  gmgn_token_url:
    sol: "https://gmgn.ai/sol/token/{ca}"
    bsc: "https://gmgn.ai/bsc/token/{ca}"

stats:
  enabled: true
  sqlite_path: "data/signals.sqlite"
  snapshot_sec: 60
  track_hours: 24
  hit_multiple: 1.5
  milestone_step: 1.0
  timezone: "Asia/Shanghai"

trace:
  enabled: true
  min_gap_ms: 15000
  mc_change_pct: 0.02
  watch_min_sec: 21600
  watch_idle_sec: 7200
  watch_max_sec: 43200
  retain_hours: 72
  flush_ms: 1000

quota:
  window_sec: 10
  security_per_round:
    sol: 2
    bsc: 2
  snapshot_per_round:
    sol: 2
    bsc: 2
  on_429: read_reset
