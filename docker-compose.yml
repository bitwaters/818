services:
  pusher:
    build: .
    restart: on-failure:5
    init: true
    env_file:
      - path: .env
        required: false
    environment:
      TZ: Asia/Shanghai
      GMGN_API_KEY: ${GMGN_API_KEY:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    volumes:
      - ./params.yaml:/app/params.yaml:ro
      - ./data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
